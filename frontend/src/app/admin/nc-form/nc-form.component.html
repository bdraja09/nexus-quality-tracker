<div class="nc-form-container">
  <h2>Lever une non-conformité</h2>
  <form (ngSubmit)="onSubmit()">
    <input [(ngModel)]="title" name="title" placeholder="Titre" required>
    <textarea [(ngModel)]="description" name="description" placeholder="Description" required></textarea>
    <select [(ngModel)]="severity" name="severity">
      <option value="low">Faible</option>
      <option value="medium">Moyenne</option>
      <option value="high">Élevée</option>
      <option value="critical">Critique</option>
    </select>
    <input [(ngModel)]="deptId" name="deptId" placeholder="ID du département" required>
    <button type="submit">Lever la NC</button>
  </form>
  <p class="success" *ngIf="success">NC créée avec succès : {{ success }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>
</div>
